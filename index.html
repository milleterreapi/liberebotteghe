        <div class="field"><label>Colore della tenda</label><div class="swatches" role="group" aria-label="Colore della tenda">${AWNINGS.map(([k,c])=>`<button type="button" class="sw" data-tenda="${k}" aria-pressed="${tenda===k}" title="${k}"><span class="awning" style="--c:${c};display:block"></span></button>`).join("")}</div></div>
        <div class="field full"><label for="f-ind">Indirizzo esatto</label><input id="f-ind" name="indirizzo" maxlength="140" value="${esc(d.indirizzo)}" placeholder="Via Roma 12"><small>Via e numero civico. Il paese va nel campo "Paese". Da qui il sito mette il segnaposto sulla mappa e crea il pulsante "Apri in Google Maps".</small></div>
        <div class="field full"><label>Il punto sulla mappa</label>
          <div class="locrow"><div style="display:grid;gap:10px;align-content:start">
          <input type="hidden" name="provincia" value="${esc(S.formProv??d.provincia??"")}">
          <button class="btn primary" data-geocode type="button" ${S.sample===null?"hidden":""}>Trova il mio indirizzo sulla mappa</button>
          <span id="locState" class="muted" style="font-size:13.5px">${locStatus(d)}</span>
          <details class="exact" ${(S.formPrecise??d.precisa)?"open":""}><summary>Per il punto al metro: coordinate da Google Maps</summary>
            <div style="display:grid;gap:8px;margin-top:10px">
            <input id="f-coord" name="coord" inputmode="decimal" aria-label="Coordinate da Google Maps" placeholder="40.6712, 14.7268" value="${(S.formPrecise??d.precisa)&&(S.formLoc||shopLoc(d))?esc((S.formLoc||shopLoc(d)).lat.toFixed(5)+", "+(S.formLoc||shopLoc(d)).lon.toFixed(5)):""}">
            <small class="muted">Apri Google Maps, tieni premuto (sul computer: clic destro) sulla porta della bottega e copia i due numeri che compaiono. Incollali qui. Va bene anche un link di Google Maps completo.</small>
            <a class="btn sm" id="gmSearch" href="${esc("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([d.indirizzo,d.paese].filter(Boolean).join(", ")||"Italia"))}" target="_blank" rel="noopener">Apri il mio indirizzo su Google Maps</a></div>
          </details></div>
          ${miniMap(S.formLoc||shopLoc(d))}</div></div>
        <div class="field full"><label for="f-desc">Racconta la tua bottega</label><textarea id="f-desc" name="descrizione" maxlength="800" placeholder="Cosa fai, come lo fai, da quanto tempo">${esc(d.descrizione)}</textarea></div>
        <div class="field full"><label for="f-cons">Consegna e ritiro</label><input id="f-cons" name="consegna" maxlength="160" value="${esc(d.consegna)}" placeholder="Es. Spedizione in tutta Italia, ritiro in laboratorio il sabato"></div>
        <div class="field"><label for="f-wa">WhatsApp per gli ordini</label><input id="f-wa" name="whatsapp" inputmode="tel" maxlength="20" value="${esc(d.whatsapp)}" placeholder="+39 333 1234567"><small>Gli ordini dal cestino arrivano qui</small></div>
        <div class="field"><label for="f-tel">Telefono</label><input id="f-tel" name="telefono" inputmode="tel" maxlength="20" value="${esc(d.telefono)}"></div>
        <div class="field"><label for="f-mail">Email</label><input id="f-mail" name="email" type="email" maxlength="80" value="${esc(d.email)}"></div>
        <div class="field"><label for="f-ig">Instagram</label><input id="f-ig" name="instagram" maxlength="60" value="${esc(d.instagram)}" placeholder="@labottega"></div>
        <div class="field full"><label for="f-sito">Sito web</label><input id="f-sito" name="sito" maxlength="120" value="${esc(d.sito)}"></div>
        <div class="field full"><label for="f-cover">Foto della vetrina</label>
          <div class="photo-in"><div class="prev" id="coverPrev">${d.coverV?`<div data-img="${esc(imgKey(S.uid,"_cover",d.coverV))}" style="width:100%;height:100%"></div>`:"nessuna"}</div>
          <input id="f-cover" type="file" accept="image/*"></div></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center">
        <button class="btn primary" type="submit">${exists?"Salva la bottega":"Apri la bottega"}</button>
        ${exists?(S.confirm==="close"?`<span class="confirm">Chiudere la bottega e cancellare tutti i prodotti? <button class="btn sm danger" data-close type="button">Sì, chiudi</button><button class="btn sm ghost" data-cancel type="button">Annulla</button></span>`:`<button class="btn ghost danger" data-ask="close" type="button">Chiudi la bottega</button>`):""}
      </div>
    </form>

    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap"><h3 style="font-size:22px">I prodotti</h3><span class="muted mono">${ps.length}/${MAX_PRODUCTS}</span></div>
      ${!exists?`<p class="note">Salva prima la bottega, poi potrai mettere i prodotti sul banco.</p>`:`
      <div class="plist">${ps.map(p=>`<div class="pitem">
        <div class="t">${p.fotoV?`<div data-img="${esc(imgKey(S.uid,p.id,p.fotoV))}" style="width:100%;height:100%"></div>`:""}</div>
        <div style="min-width:0"><div class="n">${esc(p.nome)}</div><div class="muted mono" style="font-size:13px">${eur(p.prezzo)}${p.unita?" / "+esc(p.unita):""}${p.disponibile===false?` · <span class="soldout">esaurito</span>`:""}</div></div>
        <div class="acts">${S.confirm==="rm:"+p.id?`<button class="btn sm danger" data-rm="${esc(p.id)}" type="button">Elimina</button><button class="btn sm ghost" data-cancel type="button">No</button>`:`<button class="btn sm" data-edit="${esc(p.id)}" type="button">Modifica</button><button class="btn sm ghost danger" data-ask="rm:${esc(p.id)}" type="button" aria-label="Elimina ${esc(p.nome)}">✕</button>`}</div>
      </div>`).join("")}</div>
      ${productForm(ed ? ps.find(p=>p.id===ed) : null, ps.length)}`}
    </section>
  </div>`;
}

function productForm(p, count){
  if (!p && count>=MAX_PRODUCTS) return `<p class="note" style="margin-top:14px">Hai raggiunto il massimo di ${MAX_PRODUCTS} prodotti.</p>`;
  p = p || {};
  return `<form id="prodForm" class="form" style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px" autocomplete="off">
    <div class="full lbl">${p.id?"Modifica prodotto":"Nuovo prodotto"}</div>
    <div class="field full"><label for="p-nome">Nome *</label><input id="p-nome" name="nome" required maxlength="70" value="${esc(p.nome)}"></div>
    <div class="field"><label for="p-prezzo">Prezzo in € *</label><input id="p-prezzo" name="prezzo" required inputmode="decimal" value="${p.prezzo!=null?esc(String(p.prezzo).replace(".",",")):""}" placeholder="12,50"></div>
    <div class="field"><label for="p-unita">Unità</label><input id="p-unita" name="unita" maxlength="20" value="${esc(p.unita)}" placeholder="pezzo, vasetto 500 g, kg"></div>
    <div class="field full"><label for="p-desc">Descrizione</label><textarea id="p-desc" name="descrizione" maxlength="300">${esc(p.descrizione)}</textarea></div>
    <div class="field full"><label for="p-foto">Foto</label><div class="photo-in"><div class="prev" id="prodPrev">${p.fotoV?`<div data-img="${esc(imgKey(S.uid,p.id,p.fotoV))}" style="width:100%;height:100%"></div>`:"nessuna"}</div><input id="p-foto" type="file" accept="image/*"></div></div>
    <label class="full" style="display:flex;gap:8px;align-items:center;font-size:14px"><input id="p-disp" type="checkbox" name="disponibile" ${p.disponibile!==false?"checked":""}> Disponibile</label>
    <div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" type="submit">${p.id?"Salva prodotto":"Metti sul banco"}</button>${p.id?`<button class="btn ghost" data-newprod type="button">Annulla</button>`:""}</div>
  </form>`;
}

/* ---------- cart ---------- */
function waNum(s){ let d=String(s||"").replace(/\D/g,""); if(d.startsWith("00")) d=d.slice(2); if(d.length<=10 && !String(s).trim().startsWith("+")) d="39"+d; return d; }
function orderText(s, lines, tot){
  return `Ciao ${s.produttore||s.nome}, vorrei ordinare dalla tua bottega "${s.nome}" su Libere Botteghe:\n` +
    lines.map(l=>`• ${l.q} × ${l.p.nome}${l.p.unita?" ("+l.p.unita+")":""} — ${eurIt(l.q*l.p.prezzo)}`).join("\n") +
    `\nTotale indicativo: ${eurIt(tot)}\n\nNome:\nIndirizzo o ritiro:`;
}
function renderCart(){
  const ov = $("#overlay");
  if (!S.cartOpen){ ov.innerHTML=""; return; }
  const groups = Object.entries(S.cart).map(([sid,items])=>{
    const d=S.shops.get(sid); if(!d||!d.nome) return null; const s={id:sid,...d};
    const lines = Object.entries(items).map(([pid,q])=>({p:(s.prodotti||[]).find(x=>x.id===pid),q})).filter(l=>l.p&&l.q>0);
    if(!lines.length) return null;
    const tot = lines.reduce((a,l)=>a+l.q*(Number(l.p.prezzo)||0),0);
    return {s,lines,tot,text:orderText(s,lines,tot)};
  }).filter(Boolean);
  ov.innerHTML = `<div class="scrim" data-closecart></div>
  <aside class="drawer" role="dialog" aria-label="Cestino" aria-modal="true">
    <header><h2>Il cestino</h2><button class="btn sm ghost" data-closecart type="button">Chiudi</button></header>
    <div class="scroll">
    ${groups.length? `<p class="muted" style="font-size:13.5px">Ogni bottega riceve il suo ordine. Il pagamento e la consegna li concordi direttamente con il produttore.</p><p class="only-foreign i18n-note" style="font-size:13.5px">Il messaggio dell'ordine resta in italiano, così l'artigiano lo capisce subito. Se vuoi, aggiungi in fondo una nota nella tua lingua.</p>` + groups.map(g=>`<div class="order">
      <div class="awning" style="--c:${awn(g.s.tenda)};height:22px;-webkit-mask:none;mask:none"></div>
      <div class="in"><h3 style="font-size:20px">${esc(g.s.nome)}</h3>
      ${g.lines.map(l=>`<div class="line"><span style="min-width:0;overflow-wrap:anywhere">${esc(l.p.nome)}</span>
        <span class="qty"><button type="button" data-q="${esc(g.s.id)}|${esc(l.p.id)}|-1" aria-label="Meno">−</button><span class="mono">${l.q}</span><button type="button" data-q="${esc(g.s.id)}|${esc(l.p.id)}|1" aria-label="Più">+</button></span>
        <span class="mono">${eur(l.q*l.p.prezzo)}</span></div>`).join("")}
      <div class="tot"><span>Totale</span><span class="mono">${eur(g.tot)}</span></div>
      <div class="msg" id="msg-${esc(g.s.id)}">${esc(g.text)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${g.s.whatsapp?`<a class="btn primary sm" target="_blank" rel="noopener" data-track="ordine|${esc(g.s.id)}" href="https://wa.me/${waNum(g.s.whatsapp)}?text=${encodeURIComponent(g.text)}">Invia su WhatsApp</a>`:""}
        <button class="btn sm" data-copy="${esc(g.text)}" data-track="ordine_copia|${esc(g.s.id)}" type="button">Copia il messaggio</button>
        <button class="btn sm ghost danger" data-clear="${esc(g.s.id)}" type="button">Svuota</button>
      </div>
      ${!g.s.whatsapp?`<p class="muted" style="font-size:13px">${(g.s.email||g.s.telefono)?`Questa bottega non ha WhatsApp: copia il messaggio e invialo a: <span class="v" style="user-select:all">${esc(g.s.email||g.s.telefono)}</span>`:"Questa bottega non ha WhatsApp: copia il messaggio e invialo ai contatti della bottega."}</p>`:""}
      </div></div>`).join("") : `<p class="muted">Il cestino è vuoto. Entra in una bottega e aggiungi quello che ti piace.</p>`}
    </div></aside>`;
}

/* ---------- events ---------- */
function bindView(){
  const q = $("#q");
  if (q){ q.addEventListener("input", e=>{ S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }); }
  const lf = $("#loginForm"); if (lf) lf.addEventListener("submit", async e=>{ e.preventDefault(); const email=$("#l-email").value.trim(); const btn=lf.querySelector("button"); btn.disabled=true;
    $("#loginMsg").textContent="Invio in corso…";
    const {error} = await S.sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin+location.pathname}});
    btn.disabled=false; S.loginMsg = error ? "Non sono riuscito a mandare il link: controlla l'email e riprova tra qualche minuto." : "Fatto! Apri la tua posta e tocca il link per entrare. Controlla anche lo spam.";
    $("#loginMsg").textContent=S.loginMsg; });
  bindChart(); bindUtm();
  const rl = $("#revLogin"); if (rl) rl.addEventListener("submit", async e=>{ e.preventDefault(); const email=$("#r-email").value.trim(); const btn=rl.querySelector("button[type=submit]"); btn.disabled=true;
    const {error}=await S.sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin+location.pathname+"#bottega-"+S.shopId}});
    btn.disabled=false; S.revLoginMsg = error ? "Non sono riuscito a mandare il link. Riprova tra qualche minuto." : "Fatto! Apri la tua posta e tocca il link: tornerai qui per scrivere la recensione."; $("#revLoginMsg").textContent=S.revLoginMsg; });
  const rf = $("#revForm"); if (rf) rf.addEventListener("submit", async e=>{ e.preventDefault();
    const mine=(S.reviews||[]).find(x=>x.bottega_id===S.shopId && x.autore===S.uid); const voto=S.revVoto ?? (mine?mine.voto:0);
    if(!voto) return toast("Scegli da 1 a 5 stelle.");
    const nome=$("#r-nome").value.trim(); if(nome.length<2) return toast("Scrivi il tuo nome.");
    const row={bottega_id:S.shopId, autore:S.uid, nome, voto, testo:$("#r-testo").value.trim()};
    const btn=rf.querySelector("button[type=submit]"); btn.disabled=true;
    const {error}=await S.sb.from("recensioni").upsert(row,{onConflict:"bottega_id,autore"});
    btn.disabled=false; if(error){ toast("Non sono riuscito a pubblicarla. Riprova."); return; }
    S.editReview=null; S.revVoto=null; await loadReviews(); toast("Grazie! Recensione pubblicata"); render(); });
  document.querySelectorAll("form.revreply").forEach(f=>f.addEventListener("submit", async e=>{ e.preventDefault(); const id=f.dataset.reply; const testo=f.querySelector("textarea").value.trim();
    const {error}=await S.sb.from("recensioni").update({risposta:testo||null}).eq("id",id); if(error){ toast("Non sono riuscito a salvare la risposta."); return; }
    S.replyTo=null; await loadReviews(); toast("Risposta pubblicata"); render(); }));
  const hs = $("#hsearch"); if (hs) hs.addEventListener("submit", e=>{ e.preventDefault(); document.getElementById("elenco")?.scrollIntoView({behavior:"smooth",block:"start"}); });
  const cf = $("#cfgForm"); if (cf) cf.addEventListener("submit", e=>{ e.preventDefault(); const f=e.target; const g=n=>(f.elements[n]?.value||"").trim();
    const ps = piani().map((_,i)=>({nome:g(`pl${i}n`), prezzo:g(`pl${i}p`).replace(/^€\s*/,""), periodo:g(`pl${i}t`), nota:g(`pl${i}o`), punti:g(`pl${i}u`), link:(/^https:\/\//.test(g(`pl${i}l`))?g(`pl${i}l`):"")}));
    saveCfg(c=>{ c.piani=ps; c.servizi=g("servizi"); c.contatto={whatsapp:g("whatsapp"), email:g("email")}; c.chisiamo={testo:f.elements.chi.value.trim(), persone:f.elements.persone.value.trim()}; }, "Impostazioni salvate"); });
  document.querySelectorAll("[data-featdate]").forEach(inp=>inp.addEventListener("change", e=>{ const id=e.target.dataset.featdate, v=e.target.value;
    saveCfg(c=>{ c.evidenza=c.evidenza||{}; if(v) c.evidenza[id]={fino:v}; else delete c.evidenza[id]; }, v?`In evidenza fino al ${fmtDate(v)}`:"Evidenza tolta"); }));
  const sf = $("#shopForm"); if (sf) sf.addEventListener("submit", saveShop);
  mountMap(); mountMini();
  const pv = $("#f-prov"); if (pv) pv.addEventListener("change", e=>{ const p=PROV_BY[e.target.value]; S.formProv=e.target.value; S.formLoc = p ? {lat:p[3],lon:p[2]} : null; S.formPrecise=false; keepForm(); $("#f-coord").value=""; });
  const ci = $("#f-coord"); if (ci) ci.addEventListener("input", e=>{ const v=e.target.value.trim(); if(!v) return; const l=parseCoords(v);
    if(!l){ $("#locState").textContent="Non riconosco queste coordinate: servono due numeri tipo 40.6712, 14.7268"; return; }
    S.formLoc=l; S.formPrecise=true; S.formProv=nearestProv(l); S.locMsg=null; keepForm(); const c=$("#f-coord"); c.value=l.lat.toFixed(5)+", "+l.lon.toFixed(5); toast("Punto esatto trovato: ricordati di salvare"); });
  const ai = $("#f-ind"); if (ai) ai.addEventListener("input", ()=>{ const q=[$("#f-ind").value,$("#f-paese").value].map(x=>x.trim()).filter(Boolean).join(", "); $("#gmSearch").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||"Italia"); });
  const pf = $("#prodForm"); if (pf) pf.addEventListener("submit", saveProduct);
  const cv = $("#f-cover"); if (cv) cv.addEventListener("change", async e=>{ const f=e.target.files[0]; if(!f) return; try{ S.pendingCover=await resizeImage(f,1000); $("#coverPrev").innerHTML=`<img src="${S.pendingCover}" alt="">`; }catch(_){ toast("Non riesco a leggere questa immagine."); } });
  const pfo = $("#p-foto"); if (pfo) pfo.addEventListener("change", async e=>{ const f=e.target.files[0]; if(!f) return; try{ S.pendingPhoto=await resizeImage(f,720); $("#prodPrev").innerHTML=`<img src="${S.pendingPhoto}" alt="">`; }catch(_){ toast("Non riesco a leggere questa immagine."); } });
}

function go(view, shopId){
  S.view=view; S.shopId=shopId||null; S.confirm=null;
  if (view!=="mine"){ S.editing=null; S.pendingPhoto=null; S.pendingCover=null; S.formTenda=null; S.formLoc=null; S.formProv=null; S.formPrecise=null; S.formPrecisione=null; S.locMsg=null; }
  const legal = view==="privacy"||view==="termini"||view==="cookie";
  if (view!=="shop" && !legal) try{ localStorage.setItem("puteche-view",view); }catch(e){}
  const hash = legal ? "#"+view : view==="shop" ? "#bottega-"+shopId : view==="chisiamo" ? "#chi-siamo" : view==="manifesto" ? "#manifesto" : "";
  try{ history.replaceState(null,"", hash || location.pathname+location.search); }catch(e){}
  if (view==="shop") track("visita", shopId);
  S.editReview=null; S.replyTo=null; S.revVoto=null;
  render(); window.scrollTo({top:0});
}

document.addEventListener("click", async e=>{
  const t = e.target.closest("button,[data-closecart],a"); if(!t) return;
  const ds = t.dataset;
  if (ds.track){ const [tp,id]=ds.track.split("|"); track(tp,id); }
  if (ds.mstatsreload!==undefined){ S.mstats=null; return render(); }
  if (t.id==="home") return go("market");
  if (t.id==="cartBtn"){ S.cartOpen=true; return renderCart(); }
  if (ds.view) return go(ds.view);
  if (ds.go) return go(ds.go);
  if (ds.open) { S.cartOpen=false; return go("shop", ds.open); }
  if (ds.zoom!==undefined){ if(LMAP) LMAP.fitBounds(ITALY_BOUNDS); return; }
  if (ds.voto){ S.revVoto=Number(ds.voto); document.querySelectorAll(".starpick button").forEach(b=>{ b.classList.toggle("on", Number(b.dataset.voto)<=S.revVoto); b.setAttribute("aria-checked", String(Number(b.dataset.voto)===S.revVoto)); }); return; }
  if (ds.editrev){ S.editReview=ds.editrev; S.revVoto=null; render(); $("#revForm")?.scrollIntoView({block:"center"}); return; }
  if (ds.replyto){ S.replyTo=ds.replyto; render(); $("#rr-"+CSS.escape(ds.replyto))?.focus(); return; }
  if (ds.canceledit!==undefined){ S.editReview=null; S.replyTo=null; S.revVoto=null; render(); return; }
  if (ds.delrev){ const {error}=await S.sb.from("recensioni").delete().eq("id",ds.delrev); S.confirm=null; if(error){ toast("Non sono riuscito a eliminarla. Riprova."); return; } await loadReviews(); toast("Recensione eliminata"); render(); return; }
  if (ds.scrollrev!==undefined){ e.preventDefault(); $("#recensioni")?.scrollIntoView({behavior:"smooth"}); return; }
  if (ds.sharemf!==undefined){ const url=location.origin+location.pathname+"#manifesto";
    if (navigator.share){ try{ await navigator.share({title:tt("Il manifesto di Libere Botteghe"), text:tt("Scegliamo le mani, non gli scaffali. Dieci ragioni per comprare da artigiani e piccoli produttori."), url}); }catch(_){} }
    else { try{ await navigator.clipboard.writeText(url); toast("Link al manifesto copiato"); }catch(_){ toast("Copia il link dalla barra dell'indirizzo"); } }
    return; }
  if (ds.share){ const d=S.shops.get(ds.share)||{}; const url=shareUrl(ds.share);
    if (navigator.share){ try{ await navigator.share({title:d.nome||"Libere Botteghe", text:`${d.nome||""}: ${tt("cose fatte a mano su Libere Botteghe")}`, url}); }catch(_){} }
    else { try{ await navigator.clipboard.writeText(url); toast("Link copiato"); }catch(_){ toast("Copia il link dalla barra dell'indirizzo"); } }
    return; }
  if (ds.mapconsent!==undefined){ saveConsent(true); return; }
  if (ds.cookieaccept!==undefined){ saveConsent(true); return; }
  if (ds.cookiereject!==undefined){ saveConsent(false); return; }
  if (ds.cookiecustom!==undefined || ds.cookieprefs!==undefined){ showCookieBar(true); return; }
  if (ds.cookiesave!==undefined){ saveConsent(!!$("#ck-mappa")?.checked); return; }
  if (ds.logout!==undefined){ await S.sb.auth.signOut(); S.uid=null; S.isOwner=false; toast("Sei uscito"); return go("market"); }
  if (ds.geocode!==undefined){ runGeocode(); return; }
  if (ds.lancio){ const on=ds.lancio==="on"; return saveCfg(c=>{ c.fondatrici=on; }, on?"Periodo di lancio riaperto":"Periodo di lancio chiuso"); }
  if (ds.feat){ const id=ds.feat; return saveCfg(c=>{ c.evidenza=c.evidenza||{}; c.evidenza[id]={fino:plusDays(30)}; }, "Bottega in evidenza per 30 giorni"); }
  if (ds.unfeat){ const id=ds.unfeat; return saveCfg(c=>{ if(c.evidenza) delete c.evidenza[id]; }, "Evidenza tolta"); }
  if (ds.savebotm!==undefined){ const id=$("#a-botm").value, f=$("#a-botmf").value; return saveCfg(c=>{ c.mese=id||null; c.meseFino=id?(f||null):null; }, id?"Bottega del mese salvata":"Bottega del mese tolta"); }
  if (ds.prov){ const p=PROV_BY[ds.prov]; if(p){ focusOn(p[2],p[3],120); S.mapSel="prov:"+ds.prov; render(); } return; }
  if (ds.mapsel!==undefined){ S.mapSel=ds.mapsel||null; return render(); }
  if (ds.showmap){ const d=S.shops.get(ds.showmap); const l=d&&shopLoc(d); if(l){ focusOn(l.lon,l.lat,140); S.mapSel=groupKey(l); } go("market"); $("#mappa")?.scrollIntoView({block:"start"}); return; }
  if (ds.cat!==undefined){ const isTile=t.classList.contains("cat"); S.cat = (isTile && S.cat===ds.cat) ? null : (ds.cat||null); render(); if(isTile) document.getElementById("mappa-sec")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if (ds.clearf!==undefined){ S.cat=null; S.q=""; return render(); }
  if (ds.closecart!==undefined){ S.cartOpen=false; return renderCart(); }
  if (ds.add){ const [sid,pid]=ds.add.split("|"); S.cart[sid]=S.cart[sid]||{}; S.cart[sid][pid]=(S.cart[sid][pid]||0)+1; saveCart(); toast("Aggiunto al cestino"); return render(); }
  if (ds.q){ const [sid,pid,d]=ds.q.split("|"); const c=S.cart[sid]||{}; c[pid]=Math.max(0,(c[pid]||0)+Number(d)); if(!c[pid]) delete c[pid]; if(!Object.keys(c).length) delete S.cart[sid]; saveCart(); return render(); }
  if (ds.clear){ delete S.cart[ds.clear]; saveCart(); return render(); }
  if (ds.copy!==undefined){ const v=ds.copy; try{ await navigator.clipboard.writeText(v); toast("Copiato"); }catch(_){ toast("Seleziona il testo e copialo a mano"); } return; }
  if (ds.tenda){ S.formTenda=ds.tenda; document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tenda===ds.tenda))); return; }
  if (ds.ask){ S.confirm=ds.ask; if(S.view==="mine") keepForm(); else render(); return; }
  if (ds.cancel!==undefined){ S.confirm=null; if(S.view==="mine") keepForm(); else render(); return; }
  if (ds.edit){ S.editing=ds.edit; S.pendingPhoto=null; keepForm(); $("#prodForm")?.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  if (ds.newprod!==undefined){ S.editing=null; S.pendingPhoto=null; keepForm(); return; }
  if (ds.rm) return removeProduct(ds.rm);
  if (ds.close!==undefined) return closeShop();
  if (ds.modrm) return modRemove(ds.modrm);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.cartOpen){ S.cartOpen=false; renderCart(); } });

/* keep unsaved shop-form values when re-rendering */
function readShopForm(){
  const f=$("#shopForm"); if(!f) return null;
  const g=n=>(f.elements[n]?.value||"").trim();
  return {nome:g("nome"),produttore:g("produttore"),paese:g("paese"),indirizzo:g("indirizzo"),coord:g("coord"),provincia:g("provincia"),categoria:g("categoria")||"Altro",descrizione:g("descrizione"),consegna:g("consegna"),whatsapp:g("whatsapp"),telefono:g("telefono"),email:g("email"),instagram:g("instagram"),sito:g("sito")};
}
function keepForm(){
  const draft = readShopForm(); const pd = $("#prodForm") ? new FormData($("#prodForm")) : null;
  render();
  if (draft){ const f=$("#shopForm"); for (const [k,v] of Object.entries(draft)) if (f.elements[k]) f.elements[k].value=v; if (S.formProv!=null && f.elements.provincia) f.elements.provincia.value=S.formProv; $("#f-ind")?.dispatchEvent(new Event("input")); if(S.pendingCover) $("#coverPrev").innerHTML=`<img src="${S.pendingCover}" alt="">`; }
}

async function saveShop(e){
  e.preventDefault();
  const v = readShopForm(); if(!v.nome) return toast("Dai un nome alla bottega.");
  const cur = S.shops.get(S.uid)||{};
  delete v.coord;
  if(!v.paese) return toast("Scrivi il paese della bottega.");
  const btn0 = e.submitter; if(btn0) btn0.disabled=true;
  const addr=[v.indirizzo,v.paese].filter(Boolean).join(", "), oldAddr=[cur.indirizzo,cur.paese].filter(Boolean).join(", ");
  if (!S.formLoc && S.sample && (addr!==oldAddr || typeof cur.lat!=="number")) await runGeocode();
  if (S.formProv) v.provincia=S.formProv;
  const precisa = S.formLoc ? !!S.formPrecise : (addr===oldAddr && !!cur.precisa);
  const precisione = S.formLoc ? (S.formPrecise?"esatta":S.formPrecisione||null) : (cur.precisione||null);
  const loc = S.formLoc || shopLoc(cur);
  if (!cur.nome && cur.fondatrice===undefined && lancio()) v.fondatrice = true;
  const body = {...cur, ...v, lat:loc?Math.round(loc.lat*100000)/100000:null, lon:loc?Math.round(loc.lon*100000)/100000:null, precisa, precisione, tenda:S.formTenda||cur.tenda||"cobalto", prodotti:cur.prodotti||[], creata:cur.creata||Date.now(), aggiornata:Date.now()};
  const btn = $("#shopForm button[type=submit]") || btn0;
  try{
    if (S.pendingCover){ const src=S.pendingCover; const ver=Date.now(); await queue(()=>S.db.doc(`putechi/${S.uid}/foto/_cover`).set({src})); imgCache.set(imgKey(S.uid,"_cover",ver),src); body.coverV=ver; S.pendingCover=null; }
    await queue(()=>S.db.doc(`putechi/${S.uid}`).set(body));
    S.shops.set(S.uid, body); S.formTenda=null; S.formLoc=null; S.formProv=null; S.formPrecise=null; S.formPrecisione=null; S.locMsg=null;
    toast(cur.nome?"Bottega salvata":"La tua bottega è aperta!"); render();
  }catch(err){ writeErr(err); if(btn) btn.disabled=false; }
}

function parsePrice(s){ const n=Number(String(s).replace(/\s|€/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); return isFinite(n)&&n>=0 ? Math.round(n*100)/100 : NaN; }

async function saveProduct(e){
  e.preventDefault();
  const f=e.target; const g=n=>(f.elements[n]?.value||"").trim();
  const prezzo=parsePrice(g("prezzo")); if(isNaN(prezzo)) return toast("Scrivi il prezzo come numero, per esempio 12,50.");
  const cur = S.shops.get(S.uid); if(!cur) return;
  const list = [...(cur.prodotti||[])];
  const id = S.editing || uidShort();
  const old = list.find(p=>p.id===id)||{};
  const p = {...old, id, nome:g("nome"), prezzo, unita:g("unita"), descrizione:g("descrizione"), disponibile:f.elements.disponibile.checked};
  const btn=e.submitter; if(btn) btn.disabled=true;
  try{
    if (S.pendingPhoto){ const src=S.pendingPhoto; const ver=Date.now(); await queue(()=>S.db.doc(`putechi/${S.uid}/foto/${id}`).set({src})); imgCache.set(imgKey(S.uid,id,ver),src); p.fotoV=ver; S.pendingPhoto=null; }
    const i=list.findIndex(x=>x.id===id); if(i>=0) list[i]=p; else list.push(p);
    const body={...cur, prodotti:list, aggiornata:Date.now()};
    await queue(()=>S.db.doc(`putechi/${S.uid}`).set(body));
    S.shops.set(S.uid,body); S.editing=null;
    toast(old.id?"Prodotto aggiornato":"Prodotto sul banco"); keepForm();
  }catch(err){ writeErr(err); if(btn) btn.disabled=false; }
}

async function removeProduct(id){
  const cur=S.shops.get(S.uid); if(!cur) return;
  const p=(cur.prodotti||[]).find(x=>x.id===id);
  const body={...cur, prodotti:(cur.prodotti||[]).filter(x=>x.id!==id), aggiornata:Date.now()};
  try{
    await queue(()=>S.db.doc(`putechi/${S.uid}`).set(body));
    if (p&&p.fotoV) queue(()=>S.db.doc(`putechi/${S.uid}/foto/${id}`).delete()).catch(()=>{});
    S.shops.set(S.uid,body); S.confirm=null; if(S.editing===id) S.editing=null; toast("Prodotto eliminato"); keepForm();
  }catch(err){ writeErr(err); }
}

async function wipe(shopId){
  const d=S.shops.get(shopId)||{};
  const ids=(d.prodotti||[]).filter(p=>p.fotoV).map(p=>p.id); if(d.coverV) ids.push("_cover");
  await queue(()=>S.db.doc(`putechi/${shopId}`).delete());
  for (const id of ids) await queue(()=>S.db.doc(`putechi/${shopId}/foto/${id}`).delete()).catch(()=>{});
  S.shops.delete(shopId); delete S.cart[shopId]; saveCart();
}
async function closeShop(){ try{ await wipe(S.uid); S.confirm=null; toast("Bottega chiusa"); go("market"); }catch(err){ writeErr(err); } }
async function modRemove(id){ try{ await wipe(id); toast("Bottega rimossa dal mercato"); go("market"); }catch(err){ writeErr(err); } }

/* ---------- boot ---------- */
render(); footTitolare();
window.addEventListener("hashchange", ()=>{ const h=(location.hash||"").slice(1);
  if (h==="privacy"||h==="termini"||h==="cookie") go(h);
  else if (h==="chi-siamo") go("chisiamo");
  else if (h==="manifesto") go("manifesto");
  else if (h==="prezzi") go("prezzi");
  else if (h.startsWith("bottega-")) go("shop", h.slice(8));
});
if (!consent().scelto) showCookieBar(false);
function mapErr(e){ const m=String((e&&e.message)||""); if(/row-level security|permission|not allowed|unauthori|jwt|403/i.test(m)||e?.code==="42501") return {code:"invalid_argument",message:m}; if(/quota|exceed|too large|payload/i.test(m)) return {code:"quota_exceeded",message:m}; return {code:"unavailable",message:m}; }
function makeDb(sb){
  return { doc(path){ const seg=path.split("/");
    if (seg[0]==="putechi" && seg.length===2) return {
      async get(){ const {data}=await sb.from("botteghe").select("data").eq("id",seg[1]).maybeSingle(); return {exists:!!data, data:()=>data?.data}; },
      async set(body){ const {error}=await sb.from("botteghe").upsert({id:seg[1], data:body, updated_at:new Date().toISOString()}); if(error) throw mapErr(error); },
      async delete(){ const {error}=await sb.from("botteghe").delete().eq("id",seg[1]); if(error) throw mapErr(error); } };
    if (seg[0]==="putechi" && seg[2]==="foto"){ const key=`${seg[1]}/${seg[3]}.jpg`; return {
      async set({src}){ const blob=await (await fetch(src)).blob(); const {error}=await sb.storage.from("foto").upload(key, blob, {upsert:true, contentType:"image/jpeg", cacheControl:"3600"}); if(error) throw mapErr(error); },
      async delete(){ const {error}=await sb.storage.from("foto").remove([key]); if(error) throw mapErr(error); },
      async get(){ return {exists:true, data:()=>({src: sb.storage.from("foto").getPublicUrl(key).data.publicUrl})}; } }; }
    if (path==="config/sito") return {
      async set(body){ const {error}=await sb.from("config").upsert({id:"sito", data:body}); if(error) throw mapErr(error); } };
    throw new Error("Percorso sconosciuto: "+path); } };
}
(async () => {
  const cfg = window.LB_CONFIG||{};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseKey || /INCOLLA/.test(cfg.supabaseUrl+cfg.supabaseKey)){ S.dbState="off"; S.loaded=true; return render(); }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  S.sb=sb; S.db=makeDb(sb); S.sample={};
  S.imgUrl=(shopId,pid,v)=> sb.storage.from("foto").getPublicUrl(`${shopId}/${pid}.jpg`).data.publicUrl+"?v="+v;
  const refresh=()=>{ const typing=document.activeElement?.closest?.("#shopForm,#prodForm,#cfgForm,#loginForm,#revForm,#revLogin,.revreply"); if(typing) return; if(S.view==="mine") keepForm(); else render(); };
  async function applySession(session){
    S.uid=session?.user?.id||null; S.email=session?.user?.email||null; S.canWrite=S.uid?true:null; S.isOwner=false;
    if (S.uid){ try{ const {data}=await sb.from("admins").select("user_id").eq("user_id",S.uid).maybeSingle(); S.isOwner=!!data; }catch(_){} }
  }
  try{ const {data:{session}}=await sb.auth.getSession(); await applySession(session); }catch(_){}
  if (!S.uid){ try{ sb.rpc("registra_visita_sito",{p_fonte:FONTE}).then(()=>{},()=>{}); }catch(_){} }
  sb.auth.onAuthStateChange((_e,session)=>{ setTimeout(async()=>{ const was=S.uid; await applySession(session); if(S.uid && !was){ S.loginMsg=null; if(S.view!=="shop") S.view="mine"; } render(); },0); });
  const loadShops=async()=>{ const {data,error}=await sb.from("botteghe").select("id,data"); if(error){ S.dbState="off"; S.loaded=true; render(); return; }
    const m=new Map(); (data||[]).forEach(r=>m.set(r.id,r.data)); S.shops=m; S.loaded=true; S.dbState="ready"; refresh(); };
  const loadCfg=async()=>{ const {data}=await sb.from("config").select("data").eq("id","sito").maybeSingle(); S.cfg=(data&&data.data)||{}; refresh(); };
  const loadRev=async()=>{ await loadReviews(); refresh(); };
  await Promise.all([loadShops(), loadCfg(), loadRev()]);
  if (S._trackOnLoad && S.shopId){ track("visita", S.shopId); S._trackOnLoad=false; }
  try{ sb.channel("libere-botteghe").on("postgres_changes",{event:"*",schema:"public",table:"botteghe"},()=>loadShops()).on("postgres_changes",{event:"*",schema:"public",table:"config"},()=>loadCfg()).on("postgres_changes",{event:"*",schema:"public",table:"recensioni"},()=>loadRev()).subscribe(); }catch(_){}
})();
})();
