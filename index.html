<link rel="stylesheet" href="https://fonts.bunny.net/css?family=gloock:400|instrument-sans:400,500,600,700|instrument-serif:400,400i|ibm-plex-mono:500&display=swap">
<style>
/* Layout: una piazza di botteghe — ogni bottega è una vetrina con la sua tenda a righe; i prodotti stanno sul banco sotto */
:root{
  --bg:#faf5ec; --surface:#fffdf8; --sunk:#f1e7d5; --ink:#2f2618; --muted:#76664e; --line:#e6d8bf;
  --accent:#1f6b88; --accent-ink:#ffffff; --sun:#f1c232; --sun-ink:#2a2100; --ok:#1f7a4d; --warn:#b4471f;
  --fabric:#fbf8f1; --sea:#dbe9ee; --land:#fffdf8; --coast:#9a8a6c; --grat:#e3d5bb;
  --hero-top:#f6e9cf; --hero-mid:#efdcb4; --hero-bot:#e6cc98; --hero-ink:#2f2618; --hero-sub:#5c4a30; --stone-line:rgb(150 112 52 / .16);
  --f-display:"Gloock", "Georgia", "Times New Roman", serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130d; --surface:#211b13; --sunk:#2a2318; --ink:#f3e9d6; --muted:#b8a687; --line:#3a2f20;
  --accent:#74b6d1; --accent-ink:#0d2430; --sun:#f1c232; --sun-ink:#2a2100; --ok:#5cc996; --warn:#ff9a72; --fabric:#ecebe4; --sea:#16242a; --land:#2a2318; --coast:#8a7a5c; --grat:#2c2519;
  --hero-top:#2a2114; --hero-mid:#30261a; --hero-bot:#3a2d1b; --hero-ink:#f5ead6; --hero-sub:#cdb894; --stone-line:rgb(230 200 150 / .07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130d; --surface:#211b13; --sunk:#2a2318; --ink:#f3e9d6; --muted:#b8a687; --line:#3a2f20;
  --accent:#74b6d1; --accent-ink:#0d2430; --sun:#f1c232; --sun-ink:#2a2100; --ok:#5cc996; --warn:#ff9a72; --fabric:#ecebe4; --sea:#16242a; --land:#2a2318; --coast:#8a7a5c; --grat:#2c2519;
  --hero-top:#2a2114; --hero-mid:#30261a; --hero-bot:#3a2d1b; --hero-ink:#f5ead6; --hero-sub:#cdb894; --stone-line:rgb(230 200 150 / .07); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1180px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;background:none;border:0;padding:0;cursor:pointer}
.brand .mark{width:30px;height:30px;border-radius:6px;overflow:hidden;flex:none;display:block}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.langsw{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}
.langsw button{border:0;background:none;color:var(--muted);font:600 12px/1 var(--f-mono);letter-spacing:.04em;padding:7px 8px;border-radius:999px;cursor:pointer;min-width:30px}
.langsw button[aria-pressed="true"]{background:var(--accent,var(--ink));color:var(--accent-ink,var(--bg))}
.foot-claim{font-family:var(--f-accent);font-size:20px;color:#fff}
@media (max-width:760px){.top .langsw{order:2;margin-left:auto}.top nav{order:3;margin-left:0;width:100%}}
html[lang="it"] .only-foreign{display:none}
.i18n-note{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:14px;color:var(--muted)}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-current="true"]{color:var(--ink);background:var(--sunk)}
.tab .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--sun);color:var(--sun-ink);font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:36px 24px}
.hero h1{font-size:clamp(34px,5.4vw,60px)}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%)}
.hero p{max-width:52ch;margin-top:14px;font-size:16.5px;color:var(--muted)}
.hero .side{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.how{display:grid;gap:8px;font-size:14px}
.how div{display:flex;gap:10px;align-items:baseline}
.how b{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:18px;padding-block:24px 16px}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:8px 18px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* awning */
.awning{--c:var(--accent);height:34px;background:repeating-linear-gradient(90deg,var(--c) 0 22px,var(--fabric) 22px 44px);
  -webkit-mask:radial-gradient(11px 11px at 50% 100%,#0000 98%,#000) 0 0/22px 100%;
  mask:radial-gradient(11px 11px at 50% 100%,#0000 98%,#000) 0 0/22px 100%;}
.awning.big{height:54px;background:repeating-linear-gradient(90deg,var(--c) 0 34px,var(--fabric) 34px 68px);
  -webkit-mask:radial-gradient(17px 17px at 50% 100%,#0000 98%,#000) 0 0/34px 100%;mask:radial-gradient(17px 17px at 50% 100%,#0000 98%,#000) 0 0/34px 100%}

/* shop grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.shop{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s ease, box-shadow .15s ease}
.shop:hover{transform:translateY(-2px);box-shadow:0 8px 24px -14px rgb(20 33 61 / .5)}
.shop .cover{aspect-ratio:16/9;background:var(--sunk);position:relative;overflow:hidden;max-width:100%}
.shop .cover img,.pimg img,.scover img{width:100%;height:100%;object-fit:cover;display:block}
.shop .cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:44px;color:var(--muted)}
.shop .body{padding:14px 16px 16px;display:grid;gap:6px}
.shop h3{font-size:23px}
.shop .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.shop .desc{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--sunk);font-size:12px;font-weight:600;color:var(--ink)}
.shop .foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:13px}

/* empty */
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:32px;align-items:center;padding:28px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty h2{font-size:30px}
.empty p{margin-top:8px;color:var(--muted);max-width:50ch}
.empty .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.empty .sample{pointer-events:none;position:relative}
.empty .sample::after{content:"Esempio";position:absolute;top:44px;right:10px;background:var(--ink);color:var(--bg);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
@media (max-width:760px){.empty{grid-template-columns:1fr}}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.prod{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pimg{aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;color:var(--muted);max-width:100%;overflow:hidden}
.prod .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h4{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.prod .from{font-size:12.5px;color:var(--muted);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.prod .pd{font-size:13.5px;color:var(--muted)}
.prod .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{font-family:var(--f-mono);font-size:16px}
.price small{font-size:12px;color:var(--muted);font-family:var(--f-body)}
.soldout{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}

/* shop page */
.back{margin-block:20px 12px}
.shophead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.shophead .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:28px;padding:22px 24px 26px}
.shophead h1{font-size:clamp(32px,5vw,52px)}
.shophead .who{margin-top:6px;color:var(--muted)}
.shophead .d{margin-top:14px;max-width:62ch;white-space:pre-line}
.scover{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk);max-width:100%}
.contacts{display:grid;gap:8px;margin-top:16px}
.contact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.contact .k{width:84px;flex:none}
.contact .v{min-width:0;overflow-wrap:anywhere;user-select:all}
@media (max-width:760px){.shophead .in{grid-template-columns:1fr}}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:30px 14px;flex-wrap:wrap}
.sect h2{font-size:28px}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgb(10 14 24 / .45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:26px}
.drawer .scroll{overflow:auto;padding:16px 18px;display:grid;gap:18px;align-content:start}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.order .in{padding:12px 14px 14px;display:grid;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer}
.qty span{min-width:22px;text-align:center}
.tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.msg{font-size:12.5px;white-space:pre-wrap;background:var(--sunk);padding:10px;border-radius:6px;max-height:140px;overflow:auto}

/* forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.field textarea{min-height:84px;resize:vertical}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:54px;height:30px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0;overflow:hidden}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw .awning{height:100%;-webkit-mask:none;mask:none;background:repeating-linear-gradient(90deg,var(--c) 0 9px,var(--fabric) 9px 18px)}
.mine-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.mine-grid{grid-template-columns:1fr}}
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pitem .t{width:52px;height:52px;border-radius:6px;overflow:hidden;background:var(--sunk);display:grid;place-items:center}
.pitem .t img{width:100%;height:100%;object-fit:cover}
.pitem .n{font-weight:600;overflow-wrap:anywhere}
.pitem .acts{display:flex;gap:6px}
.photo-in{display:flex;gap:12px;align-items:center}
.photo-in .prev{width:72px;height:72px;border-radius:8px;background:var(--sunk);overflow:hidden;flex:none;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.photo-in .prev img{width:100%;height:100%;object-fit:cover}
.note{padding:12px 14px;border-radius:8px;background:var(--sunk);font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px}


/* map */
.mapslot{position:relative}
.lmap{height:min(68vh,560px);width:100%}
.lmini{height:260px;width:100%}
.minimap{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:260px}
.lpin{background:none;border:0}
.lpin svg{filter:drop-shadow(0 3px 3px rgb(0 0 0 / .35));transition:transform .15s}
.lpin:hover svg,.lpin.sel svg{transform:scale(1.15);filter:drop-shadow(0 0 4px #f2c230) drop-shadow(0 3px 3px rgb(0 0 0 / .35))}
.leaflet-container{font-family:var(--f-body)}
.mapctl{z-index:500}
.mapempty{z-index:500}
.maplay{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.maplay{grid-template-columns:1fr}}
.mapbox{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sea)}
#bigmap{display:block;width:100%;height:auto;aspect-ratio:550/648;max-height:78vh;touch-action:none;cursor:grab;user-select:none}
#bigmap:active{cursor:grabbing}
.pin{cursor:pointer;transition:filter .15s}
.pin:hover,.pin:focus-visible,.pin.sel{filter:drop-shadow(0 0 3px var(--sun)) drop-shadow(0 2px 2px rgb(0 0 0 / .35));outline:none}
.pin-n{font:700 11px var(--f-body);fill:var(--fabric)}
.mapctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.mapctl .btn{min-width:38px}
.scalebar{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink)}
.scalebar span{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
.mapempty{position:absolute;left:12px;right:60px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.mapside{display:grid;gap:10px;align-content:start;min-width:0;padding-top:4px}
.mlist{display:grid;gap:6px;max-height:420px;overflow:auto}
.mitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.mrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.mrow:hover{border-color:var(--muted)}
.mrow b{display:block;font-weight:600;overflow-wrap:anywhere}
.mrow .muted{font-size:13px}
.dot{width:12px;height:12px;border-radius:3px}
#minimap{display:block;width:100%;height:auto;aspect-ratio:4/3;border:1px solid var(--line);border-radius:8px;cursor:crosshair;max-width:100%}
.exact summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent)}
.exact input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.login-wrap{display:grid;place-items:center;padding-block:40px}
.login{max-width:620px;width:100%;padding:34px}
.loginform{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.loginform input{flex:1 1 240px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:16px}
.loginform .btn{border-radius:999px;padding:12px 22px}
.acct{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px;font-size:13.5px;flex-wrap:wrap}
.locrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;align-items:start}
@media (max-width:640px){.locrow{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.status{padding:10px 14px;border-radius:8px;background:var(--sunk);font-size:14px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===================== redesign: maioliche, tende e piazza ===================== */
:root{ --cobalt:#1f6b88; --cobalt-2:#4a3820; --lemon:#f2c14e; --plaster:#fbf8f1; --leaf:#6b7f3a; --coral:#c8643f; --stone:#e2c48a; --trullo:#8e8b82; --teal:#0f7c86;
  --f-accent:"Instrument Serif", "Georgia", serif; }
body{padding:0}
.wrap{max-width:1212px;padding-inline:16px}
.page{padding-block:8px 80px;min-height:60vh}
.top{margin-inline:0;padding:10px 0;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
.brand{font-size:23px;letter-spacing:-.01em}
.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--plaster) var(--tile) center/36px;box-shadow:inset 0 0 0 2px var(--cobalt)}
.tab[aria-current="true"]{background:var(--cobalt);color:#fff}
h1 i,h2 i,h3 i{font-family:var(--f-accent);font-style:italic;font-weight:400;letter-spacing:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor}

/* hero */
.hero{display:block;position:relative;background:var(--cobalt);color:#fff;overflow:hidden;padding-block:64px 56px}
.hero::before{content:"";position:absolute;inset:0;background:var(--tile-w) 0 0/72px;opacity:.06;pointer-events:none}
.hero::after{content:"";position:absolute;width:620px;height:620px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(closest-side,rgb(242 194 48 / .22),transparent);pointer-events:none}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:48px;align-items:center}
.hero .eyebrow{color:var(--lemon)}
.hero h1{font-size:clamp(42px,6.4vw,82px);line-height:1;margin-top:18px;color:#fff;letter-spacing:-.015em}
.hero h1 i{color:var(--lemon);font-size:1.06em}
.hero p{margin-top:20px;font-size:18.5px;line-height:1.6;color:#d7e1f6;max-width:46ch}
.hsearch{margin-top:28px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px;max-width:580px;box-shadow:0 22px 44px -20px rgb(4 14 40 / .7)}
.hsearch svg{width:19px;height:19px;stroke:#5a6579;margin-left:14px;flex:none}
.hsearch input{flex:1;min-width:0;border:0;outline:0;background:none;color:#14213d;font-size:16.5px;padding:11px 6px}
.hsearch input::placeholder{color:#7d8798}
.hsearch .btn{border-radius:999px;padding:11px 24px;font-size:15px}
@media (max-width:480px){.hsearch .btn{padding:11px 16px}.hsearch input{font-size:15px}}
.hero-cta{margin-top:18px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.link-light{background:none;border:0;color:#fff;font-weight:600;cursor:pointer;padding:4px 0;border-bottom:2px solid var(--lemon);font-size:15px}
.link-light:hover{color:var(--lemon)}
.stats{display:flex;gap:40px;margin:34px 0 0;flex-wrap:wrap;padding-top:22px;border-top:1px solid rgb(255 255 255 / .16);max-width:580px}
.stats div{display:flex;flex-direction:column-reverse}
.stats dt{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#a9b9e2;margin-top:6px}
.stats dd{margin:0;font-family:var(--f-display);font-size:44px;line-height:1;color:#fff}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto;display:block;max-width:470px;margin-inline:auto;filter:drop-shadow(0 34px 40px rgb(4 14 40 / .45))}
.drape{height:22px;background:radial-gradient(circle at 50% 0,var(--cobalt) 21px,transparent 21.5px) 0 0/44px 22px repeat-x}
.hero-txt{min-width:0}
@media (max-width:880px){.hero-in{grid-template-columns:minmax(0,1fr);gap:28px}.hero-art svg{max-width:330px}.hero{padding-block:40px 40px}}
.intro .hero-txt>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.intro .hero-txt>*:nth-child(2){animation-delay:.07s}.intro .hero-txt>*:nth-child(3){animation-delay:.14s}.intro .hero-txt>*:nth-child(4){animation-delay:.21s}.intro .hero-txt>*:nth-child(5){animation-delay:.28s}.intro .hero-txt>*:nth-child(6){animation-delay:.35s}
.intro .hero-art{animation:rise 1s .15s cubic-bezier(.2,.7,.2,1) both}
.intro .awn-roll{transform-box:fill-box;transform-origin:50% 0;animation:roll .9s .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes roll{from{transform:scaleY(.05)}}
@media (prefers-reduced-motion:reduce){.intro *,.intro{animation:none!important}}

/* sections */
.sec{padding-block:72px 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:26px}
.sec-h h2{font-size:clamp(32px,4.2vw,50px);margin-top:10px;letter-spacing:-.01em}
.sec-h p{color:var(--muted);max-width:44ch;margin-top:8px}
.sec-h .right{display:flex;gap:10px;align-items:center}
.count-b{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px}

/* mestieri */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.cat{--c:var(--cobalt);position:relative;display:grid;justify-items:start;gap:3px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;overflow:hidden;transition:transform .18s ease,border-color .18s,box-shadow .18s}
.cat::after{content:"";position:absolute;right:-22px;top:-22px;width:70px;height:70px;border-radius:50%;background:var(--c);opacity:.1;transition:transform .3s ease}
.cat:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 14px 28px -20px var(--c)}
.cat:hover::after{transform:scale(1.5)}
.cat .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);margin-bottom:8px}
.cat .ic svg{width:25px;height:25px;fill:none;stroke:color-mix(in srgb,var(--c) 78%,var(--ink));stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cat b{font-weight:600;font-size:15px}
.cat small{color:var(--muted);font-size:12.5px}
.cat[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}

/* mappa e card */
.mapbox{border-radius:20px;box-shadow:0 24px 50px -36px rgb(15 42 107 / .6)}
.shop{border-radius:18px;transition:transform .2s ease,box-shadow .2s ease}
.shop:hover{transform:translateY(-5px);box-shadow:0 26px 44px -28px rgb(15 42 107 / .65)}
.shop .cover{aspect-ratio:4/3}
.shop h3{font-size:25px;letter-spacing:-.005em}
.tilebg{background-color:var(--plaster);background-repeat:repeat}
.plaque{position:absolute;left:50%;top:50%;translate:-50% -50%;width:78px;height:78px;border-radius:50%;background:var(--plaster);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--cobalt-2);box-shadow:0 0 0 5px var(--c),0 14px 24px -10px rgb(0 0 0 / .45)}
.prod{border-radius:16px;transition:transform .2s ease,box-shadow .2s ease}
.prod:hover{transform:translateY(-3px);box-shadow:0 20px 36px -26px rgb(15 42 107 / .6)}
.pimg{position:relative}
.pimg .plaque{width:60px;height:60px;font-size:22px}
.shophead{border-radius:20px}
.scover{position:relative;border-radius:14px}
.empty{border-radius:20px}

/* come funziona */
.howto{margin-top:0;background:var(--surface);border-block:1px solid var(--line);padding-block:64px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px;margin-top:8px}
@media (max-width:760px){.steps{grid-template-columns:1fr;gap:24px}}
.step{display:grid;gap:8px;align-content:start}
.step .n{font-family:var(--f-accent);font-style:italic;font-size:76px;line-height:.9;color:var(--accent)}
.step h3{font-size:26px}
.step p{color:var(--muted);max-width:36ch}

/* per i produttori */
.join{position:relative;background:var(--lemon);color:#241d05;padding-block:76px;overflow:hidden}
.join::before{content:"";position:absolute;right:0;top:0;bottom:0;width:min(48%,560px);background:var(--tile) 0 0/84px;-webkit-mask:linear-gradient(90deg,transparent,#000 45%);mask:linear-gradient(90deg,transparent,#000 45%)}
.join-in{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center}
@media (max-width:880px){.join-in{grid-template-columns:minmax(0,1fr)}.join::before{opacity:.25;width:100%}}
.join .eyebrow{color:var(--cobalt-2)}
.join h2{font-size:clamp(34px,4.8vw,58px);color:#14213d;margin-top:12px;letter-spacing:-.01em}
.join h2 i{color:var(--cobalt)}
.join ul{list-style:none;padding:0;margin:24px 0 30px;display:grid;gap:14px}
.join li{display:flex;gap:12px;align-items:flex-start;font-size:16.5px;color:#2b240b;max-width:52ch}
.join li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.btn.cobalt{background:var(--cobalt);border-color:var(--cobalt);color:#fff;padding:13px 24px;font-size:16px;border-radius:999px}
.btn.cobalt:hover{background:var(--cobalt-2)}
.join .card-demo{justify-self:center;width:min(100%,320px);transform:rotate(2.5deg)}

/* piè di pagina */
.sitefoot{background:var(--cobalt-2);color:#c3cfeb;padding-block:0 40px}
.sitefoot .drape{background:radial-gradient(circle at 50% 0,var(--bg) 21px,transparent 21.5px) 0 0/44px 22px repeat-x;margin-bottom:34px}
.foot-in{display:flex;justify-content:space-between;gap:28px 40px;flex-wrap:wrap}
.sitefoot .brand{color:#fff;cursor:default}
.sitefoot p{max-width:46ch;margin-top:14px;font-size:14.5px;line-height:1.6}
.foot-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.foot-nav button{background:none;border:1px solid rgb(255 255 255 / .22);color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600}
.foot-nav button:hover{background:rgb(255 255 255 / .08)}
.sitefoot small{display:block;margin-top:34px;color:#8797c0;font-size:12.5px}

/* evidenza, prezzi, gestione */
.ribbon{position:absolute;z-index:2;top:12px;left:12px;background:var(--lemon);color:#241d05;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;box-shadow:0 6px 14px -6px rgb(0 0 0 / .45)}
.btn.line-dark{background:none;border:1.5px solid #14213d;color:#14213d;padding:12px 22px;border-radius:999px;font-size:16px}
.botm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;padding:0;width:100%;transition:transform .2s ease,box-shadow .2s ease}
.botm:hover{transform:translateY(-3px);box-shadow:0 26px 50px -32px rgb(15 42 107 / .6)}
.botm .bc{position:relative;min-height:300px;overflow:hidden}
.botm .bc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.botm .bt{padding:30px 32px;display:grid;gap:10px;align-content:center}
.botm .bt h3{font-size:clamp(30px,3.6vw,44px)}
.botm .bt p{color:var(--muted);max-width:52ch}
.botm .awning{position:absolute;left:0;right:0;top:0;z-index:1}
@media (max-width:760px){.botm{grid-template-columns:1fr}.botm .bc{min-height:200px}.botm .bt{padding:22px}}
.feat-grid{margin-top:22px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:8px}
.plan{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 24px 24px;overflow:hidden}
.plan .awning{position:absolute;top:0;left:0;right:0;height:16px;-webkit-mask:none;mask:none}
.plan h3{font-size:26px;margin-top:8px}
.plan .price{font-family:var(--f-display);font-size:52px;line-height:1;display:flex;align-items:baseline;gap:8px}
.plan .price small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.plan .tag{align-self:flex-start;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--lemon) 35%,transparent);color:var(--ink)}
.plan ul{list-style:none;padding:0;margin:4px 0 8px;display:grid;gap:9px;flex:1}
.plan li{display:flex;gap:10px;font-size:14.5px}
.plan li::before{content:"✓";color:var(--accent);font-weight:700;flex:none}
.plan.hl{border-color:var(--cobalt);box-shadow:0 0 0 1.5px var(--cobalt),0 26px 50px -34px rgb(15 42 107 / .7)}
.faq{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px 34px;margin-top:8px}
.faq h4{margin:0 0 6px;font-size:16px}
.faq p{color:var(--muted)}
.admin-table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.admin-table th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
.admin-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.admin-table input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.tscroll{overflow-x:auto}
.pill-on{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--lemon) 45%,transparent);color:var(--ink)}
.planedit{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.planedit fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin:0;min-width:0}
.planedit legend{font-weight:700;padding:0 6px}

/* pagine legali, cookie */
.legal{max-width:76ch;margin-inline:auto;padding-block:28px 20px}
.legal h1{font-size:clamp(34px,5vw,52px)}
.legal h2{font-size:24px;margin-top:34px}
.legal h3{font-size:18px;margin-top:20px;font-family:var(--f-body);font-weight:700}
.legal p,.legal li{line-height:1.7;color:var(--ink)}
.legal p{margin-top:10px}
.legal ul{padding-left:20px;margin:10px 0 0}
.legal .meta{color:var(--muted);margin-top:8px}
.legal table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;min-width:560px}
.legal th,.legal td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.legal th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legal mark{background:color-mix(in srgb,var(--lemon) 55%,transparent);color:var(--ink);padding:0 4px;border-radius:4px}
.legal .tscroll{overflow-x:auto}
.legal .note{margin-top:18px}
.legal-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px}
.legal-links button{background:none;border:0;padding:0;color:#dbe4f7;cursor:pointer;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.legal-links button:hover{color:#fff}
#footTitolare{margin-top:10px}
.cookiebar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:1000;max-width:760px;margin-inline:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 24px 60px -20px rgb(4 14 40 / .55)}
.cookiebar h3{font-size:20px}
.cookiebar p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.55}
.cookiebar .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cookiebar .row .btn{flex:1 1 150px}
.cookiebar .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted)}
.cookiebar .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);margin-top:10px}
.cookiebar .opt input{margin-top:4px;width:18px;height:18px;flex:none}
.cookiebar .opt b{display:block}
.cookiebar a,.cookiebar .lnk{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font:inherit}
.mapgate{display:grid;place-items:center;text-align:center;gap:10px;min-height:260px;padding:28px;background:var(--plaster) var(--tile) 0 0/64px;}
.mapgate .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;max-width:420px;display:grid;gap:10px;justify-items:center}
.mapgate p{font-size:14px;color:var(--muted)}
.consent-check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--muted)}
.consent-check input{margin-top:3px;width:18px;height:18px;flex:none}
.consent-check .lnk{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font:inherit}

/* recensioni, statistiche, condivisione, chi siamo */
.stars{display:inline-flex;gap:1px;color:var(--lemon);letter-spacing:0;font-size:15px;line-height:1}
.stars .off{color:color-mix(in srgb,var(--muted) 45%,transparent)}
.rating-mini{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);font-weight:600}
.rating-mini .stars{font-size:13px}
.revsum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.revsum .big{font-family:var(--f-display);font-size:56px;line-height:1}
.revsum .stars{font-size:22px}
.revlist{display:grid;gap:12px;margin-top:16px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:6px}
.rev .rtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.rev .rtop b{font-weight:600}
.rev .when{color:var(--muted);font-size:12.5px}
.rev p{white-space:pre-line}
.rev .reply{margin-top:6px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
.rev .acts{display:flex;gap:6px;flex-wrap:wrap}
.revform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;display:grid;gap:12px}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:color-mix(in srgb,var(--muted) 45%,transparent);padding:0 2px}
.starpick button.on{color:var(--lemon)}
.verify{font-size:12.5px;color:var(--muted);margin-top:4px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:34px;line-height:1.05}
.stat .l{font-size:12.5px;color:var(--muted)}
.chart{position:relative;margin-top:16px}
.chart svg{display:block;width:100%;height:128px;overflow:visible}
.chart .ymax{position:absolute;right:0;top:-2px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.chart .xlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.sharebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.sharelink{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sharelink code{font-family:var(--f-mono);font-size:13px;background:var(--sunk);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere;user-select:all;min-width:0}
.about-vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:26px}
.about-vals div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.about-vals b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;margin-bottom:6px}

/* manifesto */
.mf-hero{position:relative;background:var(--cobalt);color:#fff;overflow:hidden;padding-block:72px 64px}
.mf-hero::before{content:"";position:absolute;inset:0;background:var(--tile-w) 0 0/72px;opacity:.06;pointer-events:none}
.mf-hero .wrap{position:relative}
.mf-hero .eyebrow{color:var(--lemon)}
.mf-hero h1{font-size:clamp(44px,7.4vw,96px);line-height:.98;margin-top:16px;max-width:14ch;letter-spacing:-.02em}
.mf-hero h1 i{color:var(--lemon)}
.mf-hero p{margin-top:22px;font-size:clamp(18px,2.1vw,23px);line-height:1.5;color:#d7e1f6;max-width:40ch;font-family:var(--f-accent);font-style:italic}
.mf-list{list-style:none;margin:0;padding:0;counter-reset:mf}
.mf-item{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:8px 34px;padding-block:44px;border-bottom:1px solid var(--line);align-items:start}
.mf-item:last-child{border-bottom:0}

const FONTE = (()=>{ try{
  const q=new URLSearchParams(location.search), clean=x=>String(x||"").toLowerCase().trim().replace(/[^a-z0-9_.\/-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
  let src=clean(q.get("utm_source")||q.get("fonte")); const camp=clean(q.get("utm_campaign"));

/* ---------- images (stored in db, fetched lazily) ---------- */
const imgCache = new Map(); let imgQueue=[], imgActive=0;
function imgKey(shopId, pid, v){ return shopId+"|"+pid+"|"+(v||0); }
function hydrateImages(){
  document.querySelectorAll("[data-img]:not([data-done])").forEach(el=>{
    const k = el.dataset.img; el.dataset.done="1";
    const hit = imgCache.get(k);
    if (typeof hit === "string") { place(el, hit); return; }
    if (hit === null) return;
    imgQueue.push(el);
  });
  pump();
}
function place(el, src){ if(!src) return; const i=new Image(); i.alt=el.dataset.alt||""; i.loading="lazy"; i.src=src; el.replaceChildren(i); }
function pump(){
  while(imgActive<4 && imgQueue.length){
    const el = imgQueue.shift(); const k = el.dataset.img;
    const hit = imgCache.get(k);
    if (typeof hit === "string"){ place(el,hit); continue; }
    if (hit instanceof Promise){ hit.then(s=>{ if(document.contains(el)) place(el,s); }); continue; }
    const [shopId,pid,ver] = k.split("|");
    if (S.imgUrl){ const u=S.imgUrl(shopId,pid,ver); imgCache.set(k,u); place(el,u); continue; }
    imgActive++;
    const p = S.db.doc(`putechi/${shopId}/foto/${pid}`).get().then(s=>{ const src = s.exists ? s.data().src : null; imgCache.set(k, src); return src; })
      .catch(()=>{ imgCache.set(k,null); return null; })
      .finally(()=>{ imgActive--; pump(); });
    imgCache.set(k,p);
    p.then(src=>{ if(src && document.contains(el)) place(el,src); });
  }
}
function resizeImage(file, max=720){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error("read"));
    fr.onload = ()=>{ const img=new Image(); img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
        let q=.8, out=c.toDataURL("image/jpeg",q); while(out.length>180000 && q>.35){ q-=.1; out=c.toDataURL("image/jpeg",q); } res(out); };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

function shopLoc(s){

    if(!g.has(k)) g.set(k,{key:k,lat:l.lat,lon:l.lon,shops:[]}); g.get(k).shops.push(s); }
  return [...g.values()];
}

}

function mountMap(){
  const slot=$("#mapslot"); if(!slot) return;
  if(!window.L){ if(consent().mappa) loadLeaflet(); return; }
  slot.querySelector(".mapgate")?.remove();
  if(!LMAP){
    LMAP_EL=document.createElement("div"); LMAP_EL.className="lmap";
    slot.appendChild(LMAP_EL);
    LMAP=L.map(LMAP_EL,{scrollWheelZoom:false, worldCopyJump:false}).setView([42.2,12.6],6);
    L.tileLayer(TILE_URL,{maxZoom:19, attribution:TILE_ATTR}).addTo(LMAP);
    L.control.scale({imperial:false}).addTo(LMAP);
    LMARKERS=L.layerGroup().addTo(LMAP);
    LMAP.on("click",()=>LMAP.scrollWheelZoom.enable());
    LMAP.on("mouseout",()=>LMAP.scrollWheelZoom.disable());
  } else slot.appendChild(LMAP_EL);
  LMAP.invalidateSize();
  if(!LMAP_FITTED){ LMAP.fitBounds(ITALY_BOUNDS); LMAP_FITTED=true; }
  LMARKERS.clearLayers();
  for (const g of (S._groups||[])){
    const names=g.shops.map(s=>s.nome).join(", ");

      .on("click",()=>{ S.mapSel=g.key; render(); }).addTo(LMARKERS);
  }
  if (S.mapFocus){ LMAP.setView([S.mapFocus.lat,S.mapFocus.lon], S.mapFocus.zoom); S.mapFocus=null; }
}

async function saveCfg(mut, msg){
  const c = JSON.parse(JSON.stringify(S.cfg||{})); mut(c);
  try{ await queue(()=>S.db.doc("config/sito").set(c)); S.cfg=c; toast(msg||"Salvato"); render(); }
  catch(e){ toast("Non salvato: solo il gestore del mercato può cambiare queste impostazioni."); }
}


/* ---------- consenso cookie e contenuti esterni ---------- */
const CONSENT_KEY="lb-consenso-v1", CONSENT_DAYS=180;
function consent(){ try{ const c=JSON.parse(localStorage.getItem(CONSENT_KEY)||"null"); if(c && Date.now()-c.data < CONSENT_DAYS*864e5) return c; }catch(e){} return {mappa:false, scelto:false}; }
function saveConsent(mappa){ const c={mappa:!!mappa, scelto:true, data:Date.now()}; try{ localStorage.setItem(CONSENT_KEY, JSON.stringify(c)); }catch(e){} S._consent=c; hideCookieBar(); render(); }
let leafletP=null;
function loadLeaflet(){
  if (window.L) return Promise.resolve();
  if (!leafletP) leafletP = new Promise((res,rej)=>{
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const js=document.createElement("script"); js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload=()=>res(); js.onerror=()=>{ leafletP=null; S.leafletFail=true; rej(); };
    document.head.appendChild(js);
  }).then(()=>render(), ()=>render());
  return leafletP;
}
function mapGateHtml(small){
  if (window.L) return "";
  if (consent().mappa) return `<div class="mapgate"><div class="card"><p>${S.leafletFail?"La mappa non si è caricata. Controlla la connessione e ricarica la pagina.":"Caricamento della mappa…"}</p></div></div>`;
  return `<div class="mapgate"${small?' style="min-height:240px"':""}><div class="card"><b>La mappa è disattivata</b><p>La mappa è fornita da OpenStreetMap: per mostrarla, il tuo browser si collega ai loro server. Puoi attivarla quando vuoi.</p><button class="btn primary sm" data-mapconsent type="button">Mostra la mappa</button><button class="lnk" data-go="cookie" type="button" style="font-size:13px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer">Maggiori informazioni</button></div></div>`;
}

    <h3>Preferenze cookie</h3>

    <label class="opt"><input id="ck-mappa" type="checkbox" ${c.mappa?"checked":""}><span><b>Mappa (OpenStreetMap)</b>Mostra le botteghe su una mappa con le strade. Per farlo il browser scarica la mappa dai server di OpenStreetMap, che ricevono il tuo indirizzo IP. Non usiamo cookie di profilazione o statistiche.</span></label>

  bar.hidden=false;

function hideCookieBar(){ const bar=$("#cookieBar"); if(bar){ bar.hidden=true; bar.innerHTML=""; } }

/* ---------- pagine legali ---------- */
function T(){ return (window.LB_CONFIG&&window.LB_CONFIG.titolare)||{}; }
function ph(v, label){ return (!v || /^\[/.test(v)) ? `<mark>${esc(label)}</mark>` : esc(v); }
function AGG(loc){ const v=(window.LB_CONFIG&&window.LB_CONFIG.aggiornamento)||"1 ottobre 2026";
  if (loc && LOC!=="it-IT"){ const M=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"]; const m=String(v).trim().toLowerCase().match(/^(\d{1,2})\s+([a-z]+)\s+(\d{4})$/); if(m&&M.indexOf(m[2])>=0){ try{ return esc(new Date(+m[3],M.indexOf(m[2]),+m[1],12).toLocaleDateString(LOC,{day:"numeric",month:"long",year:"numeric"})); }catch(_){} } }
  return esc(v); }
function titolareHtml(){ const t=T(); return `${ph(t.nome,"[Nome e cognome o ragione sociale]")}, ${ph(t.indirizzo,"[indirizzo completo]")}${t.piva&&!/^\[/.test(t.piva)?`, ${/^\d{11}$/.test(t.piva.trim())?"P.IVA ":""}${esc(t.piva)}`:`, <mark>[Partita IVA o codice fiscale]</mark>`}. Email: ${ph(t.email,"[email di contatto]")}${t.pec&&!/^\[/.test(t.pec)?`, PEC: ${esc(t.pec)}`:""}`; }
function footTitolare(){ const t=T(); const el=$("#footTitolare"); if(!el) return; const ok=v=>v&&!/^\[/.test(v); el.textContent = ok(t.nome) ? `© ${new Date().getFullYear()} Libere Botteghe · ${t.nome}${ok(t.piva)?" · "+(/^\d{11}$/.test(t.piva.trim())?"P.IVA ":"")+t.piva:""}` : `© ${new Date().getFullYear()} Libere Botteghe`; }

function viewPrivacy(){ return `<article class="legal">
<span class="eyebrow">Documenti</span><h1>Informativa privacy</h1>
<p class="meta">Ultimo aggiornamento: ${AGG()}</p>
<p>Questa informativa spiega come Libere Botteghe (liberebotteghe.it, di seguito «il sito») tratta i dati personali di chi lo visita e degli artigiani che vi aprono una bottega, ai sensi del Regolamento (UE) 2016/679 («GDPR») e del D.Lgs. 196/2003.</p>

<h2>1. Titolare del trattamento</h2>
<p>${titolareHtml()}.</p>

<h2>2. Quali dati trattiamo</h2>
<h3>Visitatori</h3>
<ul>
<li><b>Dati tecnici di navigazione</b>: indirizzo IP, tipo di browser, pagine richieste, data e ora. Li registrano automaticamente i fornitori che ospitano il sito per farlo funzionare e proteggerlo.</li>
<li><b>Dati salvati nel tuo browser</b>: il contenuto del cestino, l'ultima sezione aperta e le tue scelte sui cookie. Restano sul tuo dispositivo e non li riceviamo.</li>
<li><b>Conteggi anonimi</b>: quando arrivi sul sito, apri una bottega o tocchi i pulsanti per ordinare o contattare l'artigiano (WhatsApp, telefono, mappa, email, social), il sito aumenta di uno un contatore giornaliero. Il contatore ricorda anche la provenienza generica della visita, per esempio «facebook» o il nome di una campagna, presa dal link che hai aperto o dal sito da cui arrivi. Non registriamo chi sei, il tuo indirizzo IP o il tuo dispositivo, e non usiamo cookie per farlo. All'artigiano e al gestore mostriamo solo i totali.</li>
<li><b>Ordini</b>: quando invii un ordine tramite WhatsApp, il messaggio parte dal tuo telefono direttamente all'artigiano. Il sito non riceve né conserva i dati dell'ordine. L'artigiano tratta quei dati come titolare autonomo, e WhatsApp li tratta secondo la propria informativa.</li>
</ul>
<h3>Chi lascia una recensione</h3>
<ul>
<li><b>Email</b>, usata per entrare con il link via email. Non viene pubblicata.</li>
<li><b>Nome, voto e testo della recensione</b>, che <b>vengono pubblicati</b> sulla pagina della bottega e restano visibili a tutti, insieme alla data e all'eventuale risposta dell'artigiano.</li>

<li><b>Statistiche della bottega</b>: i totali anonimi di visite, ordini avviati e contatti aperti, visibili solo a te e al gestore.</li>

<h2>3. Perché li trattiamo e su quale base giuridica</h2>

</tbody></table></div>
<p>Non usiamo i dati per pubblicità, profilazione o decisioni automatizzate e non li vendiamo a nessuno.</p>

<h2>4. A chi vengono comunicati</h2>
<p>I dati sono trattati da fornitori che ci aiutano a far funzionare il sito, nominati responsabili del trattamento o che agiscono come titolari autonomi per i propri servizi:</p>
<ul>
<li><b>Supabase</b>: database, archivio delle foto e accesso via email. I dati sono conservati in un data center nell'Unione Europea.</li>
<li><b>Netlify</b>: hosting del sito.</li>
<li><b>OpenStreetMap Foundation</b>: mappa (solo con il tuo consenso) e ricerca degli indirizzi quando un artigiano usa «Trova il mio indirizzo».</li>
<li><b>Bunny.net</b> (caratteri tipografici), <b>unpkg</b> e <b>jsDelivr</b> (librerie del sito): ricevono l'indirizzo IP per consegnare i file al browser.</li>
<li>Servizi di pagamento (per esempio Stripe o PayPal), solo se paghi un abbonamento con il pulsante «Paga ora».</li>
<li>Consulenti e professionisti, come il commercialista, per gli obblighi di legge.</li>
</ul>
<p>I dati delle botteghe sono pubblici per scelta dell'artigiano e quindi visibili a chiunque visiti il sito.</p>

<h2>5. Trasferimenti fuori dall'Unione Europea</h2>
<p>Alcuni fornitori, come Netlify, possono trattare dati anche fuori dall'UE, per esempio negli Stati Uniti. In questi casi il trasferimento avviene con le garanzie previste dal GDPR, come il Data Privacy Framework UE-USA o le clausole contrattuali standard della Commissione europea. Il Regno Unito, dove ha sede la OpenStreetMap Foundation, è coperto da una decisione di adeguatezza.</p>

<h2>6. Per quanto tempo li conserviamo</h2>
<ul>
<li>Dati della bottega: finché la bottega resta aperta. Quando la chiudi, vengono cancellati.</li>
<li>Account e email: finché non chiedi di cancellarli.</li>
<li>Recensioni: finché l'autore non le cancella, o finché la bottega resta aperta.</li>
<li>Conteggi anonimi delle statistiche: finché la bottega resta aperta.</li>
<li>Dati di fatturazione: per il tempo previsto dalla legge (di norma 10 anni).</li>
<li>Dati tecnici di navigazione: per il tempo stabilito dai fornitori, di norma pochi giorni o settimane.</li>
<li>Dati nel tuo browser: finché non li cancelli tu. Le scelte sui cookie valgono 6 mesi.</li>
</ul>

<h2>7. I tuoi diritti</h2>
<p>Puoi chiedere in qualsiasi momento di accedere ai tuoi dati, correggerli, cancellarli, limitarne il trattamento, riceverli in un formato leggibile (portabilità) e opporti al trattamento basato sul legittimo interesse. Se hai dato un consenso, puoi revocarlo quando vuoi, senza conseguenze sul trattamento fatto prima. Scrivi a ${ph(T().email,"[email di contatto]")}: ti rispondiamo entro un mese.</p>
<p>Se ritieni che il trattamento violi la normativa, puoi presentare reclamo al <b>Garante per la protezione dei dati personali</b> (www.garanteprivacy.it).</p>

<h2>8. Obbligo di fornire i dati</h2>
<p>Per visitare il sito non devi fornire dati. Per lasciare una recensione servono l'email (non pubblicata) e un nome da mostrare. Per aprire una bottega servono almeno l'email e il nome della bottega. Gli altri dati sono facoltativi, ma senza un contatto i clienti non possono ordinare.</p>

<h2>9. Minori</h2>
<p>L'apertura di una bottega è riservata ai maggiorenni.</p>

<h2>10. Modifiche</h2>
<p>Possiamo aggiornare questa informativa. La data dell'ultimo aggiornamento è indicata in alto. In caso di cambiamenti importanti avviseremo gli artigiani via email.</p>
</article>`; }

function viewTermini(){ return `<article class="legal">

<h2>2. Il ruolo del sito negli acquisti</h2>
<p>Il sito <b>non vende prodotti</b> e non è parte dei contratti di vendita. Ogni ordine, pagamento, spedizione, reso o garanzia riguarda <b>solo il cliente e l'artigiano</b>, che si accordano direttamente, per esempio tramite WhatsApp. Il gestore non incassa il prezzo dei prodotti e non trattiene commissioni sulle vendite.</p>

<ul>

<li>rispettare le norme che si applicano alla sua attività, tra cui quelle fiscali, sull'etichettatura, sulla sicurezza dei prodotti e, per gli alimenti, sull'igiene e sulla tracciabilità;</li>

<li>usare solo testi e foto di cui possiede i diritti, senza violare marchi, diritti d'autore o la privacy di altri;</li>

<h2>6. Piani a pagamento</h2>
<p><b>Botteghe fondatrici.</b> Le botteghe aperte durante il periodo di lancio non pagano l'abbonamento base per 12 mesi dall'apertura. Non c'è alcun rinnovo automatico: almeno 30 giorni prima della scadenza il gestore avvisa l'artigiano, che può scegliere un piano a pagamento oppure chiudere la bottega senza alcun costo.</p>
<p>L'apertura della bottega e i servizi aggiuntivi («In evidenza», «Bottega del mese», servizi su misura) hanno i prezzi e le condizioni indicati nella pagina <button class="lnk" data-go="prezzi" type="button" style="background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit">Prezzi</button>. Si può pagare con il pulsante «Paga ora», quando presente, tramite un servizio di pagamento esterno, oppure accordandosi con il gestore. Il gestore emette regolare documento fiscale. I piani si rinnovano solo se l'artigiano lo conferma. Se l'abbonamento non viene pagato, la bottega può essere nascosta fino al pagamento.</p>

<h2>7. Responsabilità</h2>
<p>Il gestore si impegna a mantenere il sito funzionante e sicuro, ma non può garantire che sia sempre disponibile o privo di errori. Il gestore non risponde della qualità, della sicurezza o della conformità dei prodotti, né dell'esecuzione degli accordi tra clienti e artigiani, fermo restando quanto previsto dalla legge, inclusi i diritti dei consumatori che non possono essere limitati.</p>

<h2>8. Chiusura della bottega</h2>
<p>L'artigiano può chiudere la bottega in qualsiasi momento dalla sezione «La mia bottega». I dati della bottega, le sue recensioni e le sue statistiche vengono cancellati. Per cancellare anche l'account basta scrivere a ${ph(T().email,"[email di contatto]")}.</p>

<h2>9. Modifiche</h2>
<p>Il gestore può aggiornare queste condizioni. Le modifiche importanti verranno comunicate agli artigiani con almeno 15 giorni di anticipo. Continuando a usare il sito dopo quella data, le nuove condizioni si intendono accettate.</p>

<h2>10. Legge applicabile e foro</h2>
<p>Queste condizioni sono regolate dalla legge italiana. Per le controversie con un consumatore è competente il giudice del luogo in cui il consumatore risiede. Negli altri casi è competente il foro di ${ph(T().foro,"[città del foro competente]")}.</p>

   Se il database non ha ancora la versione con la provenienza (sql/2026-10-tracciamento.sql), usa i vecchi tipi. */
const OLD_TIPO = {ordine_copia:"ordine", whatsapp:"contatto", telefono:"contatto", maps:"contatto", email:"contatto", instagram:"contatto", sito:"contatto", copia:"contatto", condivisione:null};
let trackOld = false;
function track(tipo, id){ try{
  if(!S.sb || !id || id===S.uid) return;
  const old=()=>{ const t = tipo in OLD_TIPO ? OLD_TIPO[tipo] : tipo; if(t) S.sb.rpc("registra_evento",{p_bottega:id, p_tipo:t}).then(()=>{},()=>{}); };
  if (trackOld) return old();
  S.sb.rpc("registra_evento",{p_bottega:id, p_tipo:tipo, p_fonte:FONTE}).then(r=>{ if(r && r.error){ trackOld=true; old(); } },()=>{});
}catch(_){} }
const CONTATTI = [["whatsapp","WhatsApp"],["telefono","Telefono"],["maps","Google Maps"],["email","Email"],["instagram","Instagram"],["sito","Sito"],["copia","Contatti copiati"],["contatto","Altri contatti"]];
async function loadStats(){
  if(!S.sb || !S.uid || S.statsLoading) return; S.statsLoading=true;
  const from=new Date(); from.setDate(from.getDate()-29);
  const {data}=await S.sb.from("statistiche").select("*").eq("bottega_id",S.uid).gte("giorno",from.toLocaleDateString("sv-SE"));
  S.stats={uid:S.uid, rows:data||[]}; S.statsLoading=false;
  if(S.view==="mine") keepForm();
}
function statsSection(d){
  if(!d.nome) return "";
  if(!S.stats || S.stats.uid!==S.uid){ loadStats(); }
  const rows=(S.stats&&S.stats.uid===S.uid)?S.stats.rows:[];
  const days=[]; for(let i=29;i>=0;i--){ const t=new Date(); t.setDate(t.getDate()-i); days.push(t.toLocaleDateString("sv-SE")); }
  const sum=tipo=>rows.filter(r=>r.tipo===tipo).reduce((a,r)=>a+r.conteggio,0);
  const visite=days.map(g=>rows.filter(r=>r.tipo==="visita"&&r.giorno===g).reduce((a,r)=>a+r.conteggio,0));
  const max=Math.max(1,...visite);
  const W=600,H=128,P=0, bw=(W-8)/30, gap=2;
  const nice=Math.max(1,Math.ceil(max/ (max>10?5:1))*(max>10?5:1));
  const y=v=>H-P-(v/nice)*(H-P-10);
  const bars=visite.map((v,i)=>{ const x=4+i*bw, h=Math.max(0,(H-P)-y(v)); const lbl=`${new Date(days[i]+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"})}: ${v} ${v===1?"visita":"visite"}`;
    return `<g class="bar" data-tip="${esc(lbl)}" data-x="${x+bw/2}"><rect x="${x}" y="0" width="${bw}" height="${H-P}" fill="transparent"/>${v?`<path d="M${x+gap/2} ${H-P} V${y(v)+4} q0 -4 4 -4 h${bw-gap-8} q4 0 4 4 V${H-P} Z" fill="var(--accent)"/>`:""}</g>`; }).join("");
  const rt=ratingOf(S.uid);
  const link=shareUrl(S.uid);
  return `<section class="panel" style="margin-bottom:22px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h3 style="font-size:24px">La tua bottega in numeri</h3><span class="muted" style="font-size:13px">Ultimi 30 giorni${S.statsLoading?" · aggiornamento…":""}</span></div>
    <div class="statgrid">
      <div class="stat"><div class="n mono">${sum("visita")}</div><div class="l">Visite alla bottega</div></div>
      <div class="stat"><div class="n mono">${sum("ordine")+sum("ordine_copia")}</div><div class="l">Ordini avviati dal cestino</div></div>
      <div class="stat"><div class="n mono">${CONTATTI.reduce((a,[k])=>a+sum(k),0)}</div><div class="l">Contatti (WhatsApp, telefono, mappa, social)</div></div>
      <div class="stat"><div class="n">${rt?fmtAvg(rt.avg)+" ★":"—"}</div><div class="l">${rt?`${rt.n} ${rt.n===1?"recensione":"recensioni"}`:"Nessuna recensione"}</div></div>
    </div>
    <div class="chart" id="statChart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Visite al giorno negli ultimi 30 giorni">
      <line x1="0" x2="${W}" y1="${H-P}" y2="${H-P}" stroke="var(--line)" stroke-width="1"/>

function sumBy(rows, key, filter){ const m={}; rows.forEach(r=>{ if(filter && !filter(r)) return; const k=r[key]||"diretto"; m[k]=(m[k]||0)+(r.conteggio||0); }); return m; }
function chipsHtml(list){ return list.length ? `<div class="chips" style="margin-top:8px">${list.map(([l,n])=>`<span class="chip" style="cursor:default">${esc(l)} <span class="mono muted">${n}</span></span>`).join("")}</div>` : `<p class="muted" style="font-size:13.5px;margin-top:6px">Ancora niente.</p>`; }
const nomeFonte = f => f==="diretto" ? "Diretto o sconosciuto" : f;
function breakdownHtml(rows){
  const per=sumBy(rows,"tipo");
  const canali=CONTATTI.map(([k,l])=>[l,per[k]||0]).filter(x=>x[1]);
  const hasFonte=rows.some(r=>"fonte" in r);
  const fonti=Object.entries(sumBy(rows,"fonte",r=>r.tipo==="visita")).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([f,n])=>[nomeFonte(f),n]);
  return `<div class="breakdown" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:16px">
    <div><b style="font-size:14px">Contatti per canale</b>${chipsHtml(canali)}</div>
    ${hasFonte?`<div><b style="font-size:14px">Da dove arrivano le visite</b>${chipsHtml(fonti)}</div>`:""}</div>`;
}

function bindUtm(){
  const f=$("#utmForm"); if(!f) return;
  const out=$("#u-out"), clean=x=>String(x||"").toLowerCase().trim().replace(/[^a-z0-9_.-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30);
  const upd=()=>{ const pg=$("#u-page").value, src=$("#u-src").value, camp=clean($("#u-camp").value);
    const q=new URLSearchParams({utm_source:src}); if(camp) q.set("utm_campaign",camp);
    const base = pg.startsWith("b:") ? `${location.origin}/b/${pg.slice(2)}` : `${location.origin}/`;
    out.textContent = base+"?"+q.toString()+(pg&&!pg.startsWith("b:")?"#"+(pg==="prezzi"?"prezzi":pg):""); };
  f.addEventListener("input",upd); f.addEventListener("change",upd); upd();
  $("#u-copy").addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(out.textContent); toast("Link copiato"); }catch(_){ toast("Seleziona il testo e copialo a mano"); } });
}
function bindChart(){
  const c=$("#statChart"); if(!c) return; const tip=c.querySelector(".tip"); const svg=c.querySelector("svg");
  c.querySelectorAll(".bar").forEach(g=>{ g.addEventListener("pointerenter",()=>{ const r=svg.getBoundingClientRect(); const x=Number(g.dataset.x)/600*r.width; tip.textContent=g.dataset.tip; tip.style.left=x+"px"; tip.style.top="40px"; tip.hidden=false; }); g.addEventListener("pointerleave",()=>tip.hidden=true); });
}

function gq(s){ const l=shopLoc(s); if(s.precisa&&l) return `${l.lat},${l.lon}`; const a=[s.indirizzo,s.paese].filter(Boolean).join(", "); return a || (l?`${l.lat},${l.lon}`:""); }
const gmapsUrl = s => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(gq(s));
const gdirUrl = s => "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(gq(s));
function parseCoords(t){ t=String(t||"");
  const m=t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||t.match(/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return null; const lat=+m[1], lon=+m[2]; if(!(lat>35&&lat<48&&lon>6&&lon<19.5)) return null; return {lat,lon}; }
function locStatus(d){
  if (S.locMsg) return esc(S.locMsg);
  if (S.formPrecise??d.precisa) return "✓ Punto esatto impostato.";
  const pr = S.formPrecisione ?? d.precisione;
  if ((S.formLoc||shopLoc(d)) && pr) return pr==="comune" ? "Ho trovato il paese ma non la via: il segnaposto è al centro. Trascinalo sul punto giusto o tocca la mappa." : "✓ Indirizzo trovato. Controlla sulla mappa: se serve, trascina il segnaposto sulla porta della bottega.";
  if (S.formLoc||shopLoc(d)) return "Controlla il segnaposto sulla mappa: se serve, trascinalo sul punto giusto.";
  return "Scrivi indirizzo e paese e tocca il pulsante: il segnaposto andrà dove si trova la bottega.";
}
function addrText(){ return [$("#f-ind")?.value,$("#f-paese")?.value].map(x=>(x||"").trim()).filter(Boolean).join(", "); }
async function geocode(addr){
  const url="https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=it&accept-language=it&q="+encodeURIComponent(addr);
  let r; try{ r = await fetch(url,{headers:{"Accept":"application/json"}}); }catch(_){ throw {code:"unavailable"}; }
  if(!r.ok) throw {code: r.status===429?"rate_limited":"unavailable"};
  const j = await r.json(); if(!Array.isArray(j) || !j.length) throw {code:"not_found"};
  const it=j[0], a=it.address||{}; const lat=Number(it.lat), lon=Number(it.lon);
  if(!(lat>35&&lat<48&&lon>6&&lon<19.5)) throw {code:"not_found"};
  const iso=String(a["ISO3166-2-lvl6"]||""); const pv=iso.startsWith("IT-")?iso.slice(3):"";
  return {lat, lon, provincia: PROV_BY[pv]?pv:nearestProv({lat,lon}), precisione: (a.road||a.pedestrian||a.house_number)?"via":"comune"};
}
function geoErr(e){
  const c=e&&e.code;
  if(c==="not_granted") return "Ricerca non disponibile. Tocca la mappa sul punto della bottega.";
  if(c==="not_found") return "Non ho trovato questo indirizzo. Controlla il paese, oppure incolla le coordinate da Google Maps.";
  if(c==="rate_limited") return "Troppe ricerche ravvicinate: riprova tra un minuto.";
  return "Ricerca non riuscita. Puoi incollare le coordinate da Google Maps o toccare la mappa.";
}
async function runGeocode(){
  const a=addrText(); if(!a) { S.locMsg="Scrivi prima l'indirizzo e il paese."; keepForm(); return null; }
  S.locMsg="Cerco l'indirizzo…"; keepForm();
  const btn=$("[data-geocode]"); if(btn) btn.disabled=true;
  try{ const g=await geocode(a); S.formLoc={lat:g.lat,lon:g.lon}; S.formPrecise=false; S.formPrecisione=g.precisione; S.formProv=g.provincia; S.locMsg=null; keepForm(); return g; }
  catch(e){ S.locMsg=geoErr(e); keepForm(); return null; }
}
function nearestProv(l){ let b=null,bd=1e9; for(const p of PROV){ const d=(p[3]-l.lat)**2+((p[2]-l.lon)*CX)**2; if(d<bd){bd=d;b=p[0];} } return b; }
function addressRow(s){
  if(!gq(s)) return "";
  const txt=[s.indirizzo,s.paese].filter(Boolean).join(", ") || "Posizione sulla mappa";
  return `<div class="contact"><span class="k lbl">Indirizzo</span><span class="v">${esc(txt)}</span><a class="btn sm primary" href="${esc(gmapsUrl(s))}" target="_blank" rel="noopener" data-track="maps|${esc(s.id)}">Apri in Google Maps</a><a class="btn sm ghost" href="${esc(gdirUrl(s))}" target="_blank" rel="noopener" data-track="maps|${esc(s.id)}">Indicazioni</a></div>`;
}
function contactRows(s){
  const rows=[];
  if (s.whatsapp) rows.push(["WhatsApp", s.whatsapp, `https://wa.me/${waNum(s.whatsapp)}`, "whatsapp", "Scrivi"]);
  if (s.telefono){ const tel=String(s.telefono).replace(/[^\d+]/g,""); rows.push(["Telefono", s.telefono, tel?"tel:"+tel:"", "telefono", "Chiama"]); }
  if (s.email) rows.push(["Email", s.email, /^[^\s@]+@[^\s@]+$/.test(s.email)?"mailto:"+s.email:"", "email", "Scrivi"]);
  if (s.instagram){ const h=String(s.instagram).replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/\/$/,""); rows.push(["Instagram","@"+h,`https://instagram.com/${encodeURIComponent(h)}`, "instagram", "Apri"]); }
  if (s.sito){ const u=/^https?:\/\//.test(s.sito)?s.sito:"https://"+s.sito; rows.push(["Sito",s.sito,u,"sito","Apri"]); }
  return rows.map(([k,v,href,tp,lab])=>`<div class="contact"><span class="k lbl">${k}</span><span class="v">${esc(v)}</span>${href?`<a class="btn sm ghost" href="${esc(href)}"${/^(tel|mailto):/.test(href)?"":` target="_blank" rel="noopener"`} data-track="${tp}|${esc(s.id)}">${lab}</a>`:""}<button class="btn sm ghost" data-copy="${esc(v)}" data-track="copia|${esc(s.id)}" type="button">Copia</button></div>`).join("");
}
