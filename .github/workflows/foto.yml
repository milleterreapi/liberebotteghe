name: Scarica foto botteghe
on: push
permissions:
  contents: write
jobs:
  foto:
    if: "!contains(github.event.head_commit.message, 'foto scaricate')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scarica.py
      - run: |
          git config user.name "liberebotteghe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add foto
          git commit -m "foto scaricate [skip ci]"
          git push
